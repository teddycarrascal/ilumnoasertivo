<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comunicacion Asertiva</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            padding: 1rem;
            padding-bottom: 80px;
        }

        /* ---- HEADER ---- */
        .app-header { text-align: center; margin-bottom: 1rem; }
        .app-header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
        .app-header .subtitle { color: #a0a0c0; font-size: 0.8rem; margin-top: 0.2rem; }

        .sync-status {
            text-align: center; margin-bottom: 1rem; font-size: 0.72rem;
            display: flex; align-items: center; justify-content: center; gap: 0.4rem;
        }
        .sync-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
        .sync-dot.online { background: #4ade80; }
        .sync-dot.syncing { background: #fbbf24; animation: pulse 1s infinite; }
        .sync-dot.error { background: #f87171; }
        .sync-text { color: #a0a0c0; }
        .btn-refresh {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            color: #a0a0c0; font-size: 0.68rem; padding: 0.15rem 0.5rem; border-radius: 6px;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-refresh:hover { background: rgba(255,255,255,0.12); color: #fff; }

        /* ---- BOTTOM NAV ---- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(15, 12, 41, 0.95); backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: space-around; padding: 0.5rem 0 0.7rem;
            z-index: 50;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
            background: none; border: none; color: #6b6b8a; font-size: 0.65rem;
            font-weight: 600; cursor: pointer; padding: 0.3rem 1rem; transition: all 0.2s;
        }

        .nav-item.active { color: #818cf8; }
        .nav-item svg { width: 22px; height: 22px; }

        /* ---- VIEWS ---- */
        .view { display: none; }
        .view.active { display: block; }

        /* ---- HOME: Game Cards ---- */
        .home-title { font-size: 1rem; font-weight: 600; color: #c4b5fd; margin-bottom: 1rem; }

        .game-list { display: flex; flex-direction: column; gap: 0.75rem; max-width: 500px; margin: 0 auto; }

        .game-card-mini {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 1rem 1.2rem; cursor: pointer;
            transition: all 0.2s; display: flex; justify-content: space-between; align-items: center;
        }

        .game-card-mini:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
        .game-card-mini:active { transform: scale(0.98); }

        .gcm-info h3 { font-size: 0.95rem; font-weight: 600; color: #e0e0f0; }
        .gcm-info .gcm-date { font-size: 0.72rem; color: #6b6b8a; margin-top: 0.15rem; }

        .gcm-scores { display: flex; gap: 1rem; align-items: center; }

        .gcm-player { text-align: center; }
        .gcm-player .gcm-name { font-size: 0.65rem; color: #a0a0c0; }
        .gcm-player .gcm-score { font-size: 1.3rem; font-weight: 700; }
        .gcm-player .gcm-score.positive { color: #4ade80; }
        .gcm-player .gcm-score.negative { color: #f87171; }
        .gcm-player .gcm-score.zero { color: #fbbf24; }

        .gcm-vs { color: #6b6b8a; font-size: 0.7rem; font-weight: 600; }

        .gcm-pending {
            display: inline-block; font-size: 0.6rem; padding: 0.1rem 0.4rem;
            border-radius: 5px; background: rgba(251, 191, 36, 0.15); color: #fbbf24;
            margin-left: 0.4rem;
        }

        .gcm-arrow { color: #6b6b8a; font-size: 1.2rem; }

        /* New game button */
        .btn-new-game {
            display: block; max-width: 500px; margin: 1rem auto 0; width: 100%;
            padding: 0.9rem; border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 16px; background: transparent; color: #818cf8;
            font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }

        .btn-new-game:hover { border-color: #818cf8; background: rgba(99, 102, 241, 0.08); }

        /* ---- CREATE GAME VIEW ---- */
        .create-section {
            max-width: 460px; margin: 0 auto;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px; padding: 1.5rem; backdrop-filter: blur(10px);
        }

        .create-section h2 { font-size: 1.1rem; margin-bottom: 1rem; }

        .form-row { display: flex; gap: 0.75rem; margin-bottom: 0.75rem; flex-wrap: wrap; }

        .form-row input {
            flex: 1; min-width: 120px; padding: 0.7rem 1rem;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
            background: rgba(255,255,255,0.08); color: #fff; font-size: 0.95rem;
            outline: none; transition: border-color 0.2s;
        }

        .form-row input:focus { border-color: #818cf8; }
        .form-row input::placeholder { color: #6b6b8a; }
        .form-row input.input-error { border-color: #f87171; }

        .form-error {
            display: none; color: #f87171; font-size: 0.78rem; margin-bottom: 0.6rem;
            padding: 0.4rem 0.8rem; background: rgba(248, 113, 113, 0.1); border-radius: 8px;
        }
        .form-error.visible { display: block; }

        .btn-create {
            width: 100%; padding: 0.8rem; border: none; border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-create:hover { opacity: 0.9; }
        .btn-create:active { transform: scale(0.98); }

        /* Back button */
        .btn-back {
            display: inline-flex; align-items: center; gap: 0.3rem;
            background: none; border: none; color: #818cf8; font-size: 0.85rem;
            font-weight: 600; cursor: pointer; margin-bottom: 1rem; padding: 0.3rem 0;
        }
        .btn-back:hover { color: #c4b5fd; }

        /* ---- GAME DETAIL VIEW ---- */
        .game-detail { max-width: 500px; margin: 0 auto; }

        .gd-header { text-align: center; margin-bottom: 1.5rem; }
        .gd-header h2 { font-size: 1.15rem; color: #c4b5fd; font-weight: 600; }
        .gd-header .gd-date { font-size: 0.75rem; color: #6b6b8a; margin-top: 0.2rem; }

        .players { display: flex; gap: 1rem; }

        .player {
            flex: 1; text-align: center; background: rgba(255,255,255,0.04);
            border-radius: 16px; padding: 1rem 0.5rem;
        }

        .player-name {
            font-size: 0.85rem; font-weight: 600; color: #e0e0f0; margin-bottom: 0.5rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .player-score {
            font-size: 2.8rem; font-weight: 700; line-height: 1;
            margin-bottom: 0.8rem; transition: all 0.3s ease;
        }

        .player-score.positive { color: #4ade80; }
        .player-score.negative { color: #f87171; }
        .player-score.zero { color: #fbbf24; }

        .player-buttons { display: flex; flex-direction: column; gap: 0.5rem; }
        .player-buttons .btn-label { font-size: 0.63rem; color: #6b6b8a; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 0.2rem; }

        .btn-point {
            border: none; border-radius: 12px; padding: 0.65rem 0.5rem;
            font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s; line-height: 1.2;
        }
        .btn-point:active { transform: scale(0.93); }
        .btn-assertive { background: #16a34a; color: #fff; }
        .btn-assertive:hover { background: #15803d; }
        .btn-not-assertive { background: #dc2626; color: #fff; }
        .btn-not-assertive:hover { background: #b91c1c; }

        /* Pending */
        .pending-section { margin-top: 1rem; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 0.8rem; }
        .pending-title { font-size: 0.85rem; font-weight: 600; color: #fbbf24; margin-bottom: 0.5rem; }

        .pending-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(251, 191, 36, 0.08); border: 1px solid rgba(251, 191, 36, 0.2);
            padding: 0.6rem 0.8rem; border-radius: 12px; font-size: 0.82rem;
            margin-bottom: 0.4rem; flex-wrap: wrap; gap: 0.4rem;
        }
        .pending-item .pending-info { flex: 1; min-width: 130px; }
        .pending-item .pending-who { color: #c4b5fd; font-weight: 600; }
        .pending-item .pending-pts { font-weight: 700; }
        .pending-item .pending-pts.pos { color: #4ade80; }
        .pending-item .pending-pts.neg { color: #f87171; }
        .pending-item .pending-approver { color: #fbbf24; font-size: 0.73rem; }
        .pending-actions { display: flex; gap: 0.4rem; }

        .approval-confirm {
            display: none; margin-top: 0.3rem; background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 10px;
            padding: 0.6rem 0.8rem; font-size: 0.78rem;
        }
        .approval-confirm.visible { display: block; }
        .approval-confirm p { margin-bottom: 0.4rem; color: #c4b5fd; }
        .approval-confirm .confirm-btns { display: flex; gap: 0.4rem; }

        .btn-approve, .btn-reject {
            border: none; border-radius: 8px; padding: 0.4rem 0.8rem;
            font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-approve { background: #16a34a; color: #fff; }
        .btn-approve:hover { background: #15803d; }
        .btn-reject { background: rgba(255,255,255,0.1); color: #a0a0c0; }
        .btn-reject:hover { color: #f87171; }

        .btn-approve-init {
            border: none; border-radius: 8px; padding: 0.4rem 0.8rem;
            font-size: 0.78rem; font-weight: 600; cursor: pointer;
            background: rgba(99, 102, 241, 0.3); color: #c4b5fd; transition: all 0.2s;
        }
        .btn-approve-init:hover { background: rgba(99, 102, 241, 0.5); }

        /* History */
        .game-history { margin-top: 1rem; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 0.8rem; }
        .game-history summary { color: #a0a0c0; font-size: 0.8rem; cursor: pointer; margin-bottom: 0.5rem; }
        .history-list { list-style: none; display: flex; flex-direction: column; gap: 0.35rem; max-height: 250px; overflow-y: auto; }
        .history-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.04); padding: 0.5rem 0.75rem;
            border-radius: 10px; font-size: 0.78rem;
        }
        .history-item .h-name { color: #c4b5fd; font-weight: 500; }
        .history-item .h-pts.pos { color: #4ade80; font-weight: 600; }
        .history-item .h-pts.neg { color: #f87171; font-weight: 600; }
        .history-item .h-time { color: #6b6b8a; }
        .history-item .h-approved { color: #818cf8; font-size: 0.68rem; }

        /* Delete button inside detail */
        .gd-footer { margin-top: 1.5rem; text-align: center; }

        .btn-delete-game-detail {
            background: transparent; border: 1px solid rgba(248,113,113,0.3);
            color: #f87171; font-size: 0.8rem; padding: 0.5rem 1.5rem;
            border-radius: 10px; cursor: pointer; transition: all 0.2s;
        }
        .btn-delete-game-detail:hover { background: rgba(248,113,113,0.1); }

        .delete-confirm-inline {
            display: none; margin-top: 0.8rem; padding: 1rem;
            background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.3);
            border-radius: 14px; text-align: center;
        }
        .delete-confirm-inline.visible { display: block; }
        .delete-confirm-inline p { font-size: 0.85rem; color: #fca5a5; margin-bottom: 0.6rem; }
        .dci-btns { display: flex; gap: 0.5rem; justify-content: center; }
        .btn-del-yes { border: none; border-radius: 10px; padding: 0.5rem 1.2rem; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: #dc2626; color: #fff; }
        .btn-del-no { border: none; border-radius: 10px; padding: 0.5rem 1.2rem; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: rgba(255,255,255,0.1); color: #a0a0c0; }

        .no-games-msg { text-align: center; color: #6b6b8a; font-size: 0.9rem; padding: 2rem; }

        /* ---- TABLES (Tablero + Dashboard) ---- */
        .section-container { max-width: 750px; margin: 0 auto; }
        .section-empty { text-align: center; color: #6b6b8a; font-size: 0.9rem; padding: 3rem 1rem; }

        .data-table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            background: rgba(255,255,255,0.04); border-radius: 16px; overflow: hidden;
        }
        .data-table thead th {
            background: rgba(99, 102, 241, 0.2); padding: 0.7rem 0.8rem;
            font-size: 0.72rem; font-weight: 600; color: #c4b5fd;
            text-align: left; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .data-table tbody tr { transition: background 0.2s; }
        .data-table tbody tr:hover { background: rgba(255,255,255,0.04); }
        .data-table tbody td { padding: 0.6rem 0.8rem; font-size: 0.82rem; border-top: 1px solid rgba(255,255,255,0.06); }
        .data-table tfoot td { padding: 0.7rem 0.8rem; border-top: 2px solid rgba(99, 102, 241, 0.3); font-weight: 600; font-size: 0.82rem; color: #c4b5fd; }

        .sb-game-name { color: #e0e0f0; font-weight: 500; }
        .sb-date { color: #6b6b8a; font-size: 0.72rem; }
        .sb-player-cell { display: flex; flex-direction: column; gap: 0.1rem; }
        .sb-player-name { color: #a0a0c0; font-size: 0.72rem; }
        .sb-score { font-weight: 700; font-size: 1rem; }
        .sb-score.positive { color: #4ade80; }
        .sb-score.negative { color: #f87171; }
        .sb-score.zero { color: #fbbf24; }
        .sb-leader { display: inline-block; font-size: 0.6rem; padding: 0.12rem 0.4rem; border-radius: 6px; font-weight: 600; }
        .sb-leader.winning { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
        .sb-leader.tied { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
        .sb-leader.losing { background: rgba(248, 113, 113, 0.1); color: #f87171; }
        .sb-pending-badge { display: inline-block; font-size: 0.6rem; padding: 0.1rem 0.4rem; border-radius: 5px; background: rgba(251, 191, 36, 0.15); color: #fbbf24; }

        /* Dashboard */
        .dash-rank { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-size: 0.72rem; font-weight: 700; margin-right: 0.4rem; }
        .dash-rank.gold { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
        .dash-rank.silver { background: rgba(192, 192, 192, 0.2); color: #c0c0c0; }
        .dash-rank.bronze { background: rgba(205, 127, 50, 0.2); color: #cd7f32; }
        .dash-rank.normal { background: rgba(255,255,255,0.08); color: #a0a0c0; }
        .dash-name { color: #e0e0f0; font-weight: 600; font-size: 0.9rem; }
        .dash-games-badge { display: inline-block; font-size: 0.68rem; padding: 0.12rem 0.4rem; border-radius: 6px; background: rgba(99, 102, 241, 0.15); color: #818cf8; font-weight: 600; }
        .dash-avg { font-size: 0.8rem; color: #a0a0c0; }
        .dash-bar-container { width: 100%; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; margin-top: 0.25rem; overflow: hidden; }
        .dash-bar { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
        .dash-bar.positive { background: linear-gradient(90deg, #16a34a, #4ade80); }
        .dash-bar.negative { background: linear-gradient(90deg, #dc2626, #f87171); }
        .dash-game-list { font-size: 0.65rem; color: #6b6b8a; margin-top: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }

        /* Loading */
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 12, 41, 0.9); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .loading-overlay.hidden { display: none; }
        .loading-spinner { text-align: center; color: #c4b5fd; }
        .loading-spinner .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #818cf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 0.8rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
        .pop { animation: pop 0.3s ease; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .pulse { animation: pulse 1.5s ease infinite; }

        @media (max-width: 500px) {
            .player-score { font-size: 2.2rem; }
            .btn-point { font-size: 0.75rem; padding: 0.55rem 0.4rem; }
            .data-table thead th { font-size: 0.65rem; padding: 0.5rem; }
            .data-table tbody td { padding: 0.45rem 0.5rem; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"><div class="spinner"></div><p>Conectando...</p></div>
</div>

<div class="app-header">
    <h1>Comunicacion Asertiva</h1>
    <p class="subtitle">+50 asertivo &nbsp;|&nbsp; -60 no asertivo</p>
</div>

<div class="sync-status">
    <span class="sync-dot online" id="syncDot"></span>
    <span class="sync-text" id="syncText">Conectado</span>
    <button class="btn-refresh" onclick="loadFromCloud()">Actualizar</button>
</div>

<!-- ======================== VIEWS ======================== -->

<!-- HOME -->
<div class="view active" id="view-home">
    <div id="homeContent"></div>
</div>

<!-- CREATE GAME -->
<div class="view" id="view-create">
    <button class="btn-back" onclick="navigateTo('home')">&#8592; Volver</button>
    <div class="create-section">
        <h2>Crear nuevo juego</h2>
        <div class="form-row">
            <input type="text" id="player1Name" placeholder="Nombre Jugador 1" maxlength="20">
            <input type="text" id="player2Name" placeholder="Nombre Jugador 2" maxlength="20">
        </div>
        <div class="form-error" id="formError"></div>
        <button class="btn-create" onclick="createGame()">Crear Juego</button>
    </div>
</div>

<!-- GAME DETAIL -->
<div class="view" id="view-game">
    <button class="btn-back" onclick="navigateTo('home')">&#8592; Volver a juegos</button>
    <div id="gameDetail"></div>
</div>

<!-- SCOREBOARD -->
<div class="view" id="view-tablero">
    <div class="section-container" id="scoreboard"></div>
</div>

<!-- DASHBOARD -->
<div class="view" id="view-dashboard">
    <div class="section-container" id="dashboard"></div>
</div>

<!-- ======================== BOTTOM NAV ======================== -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="navigateTo('home')" id="nav-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V10"/></svg>
        Juegos
    </button>
    <button class="nav-item" onclick="navigateTo('tablero')" id="nav-tablero">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Tablero
    </button>
    <button class="nav-item" onclick="navigateTo('dashboard')" id="nav-dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Jugadores
    </button>
</nav>

<script>
    // ============================================
    // CONFIG
    // ============================================
    // >>> PEGA TU URL DE GOOGLE APPS SCRIPT AQUI <<<
    const API_URL = 'https://docs.google.com/spreadsheets/d/1lWTpR9sqmroUghZWI8Zgfr0HE_ZqJxv2QqRqeq51EIs/edit?gid=0#gid=0';

    const LOCAL_BACKUP_KEY = 'asertividad_games_v5';
    let games = [];
    let selectedGameId = null;
    let deleteConfirmId = null;
    let approvalConfirmKey = null;
    let isSaving = false;

    // ============================================
    // NAVIGATION
    // ============================================
    function navigateTo(view, gameId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

        document.getElementById('view-' + (view === 'game' ? 'game' : view === 'create' ? 'create' : view)).classList.add('active');

        const navMap = { home: 'nav-home', tablero: 'nav-tablero', dashboard: 'nav-dashboard', create: 'nav-home', game: 'nav-home' };
        document.getElementById(navMap[view]).classList.add('active');

        if (view === 'home') { renderHome(); selectedGameId = null; }
        if (view === 'game' && gameId) { selectedGameId = gameId; renderGameDetail(); }
        if (view === 'tablero') renderScoreboard();
        if (view === 'dashboard') renderDashboard();
    }

    // ============================================
    // SYNC
    // ============================================
    function setSyncStatus(s, t) {
        document.getElementById('syncDot').className = 'sync-dot ' + s;
        document.getElementById('syncText').textContent = t;
    }

    async function loadFromCloud() {
        if (!API_URL || API_URL === 'PEGA_TU_URL_AQUI') {
            const backup = localStorage.getItem(LOCAL_BACKUP_KEY);
            if (backup) games = JSON.parse(backup);
            document.getElementById('loadingOverlay').classList.add('hidden');
            setSyncStatus('error', 'API no configurada');
            renderHome();
            return;
        }
        setSyncStatus('syncing', 'Cargando...');
        document.getElementById('loadingOverlay').classList.remove('hidden');
        try {
            const r = await fetch(API_URL);
            const d = await r.json();
            if (d.success) { games = d.games || []; localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(games)); setSyncStatus('online', 'Sincronizado'); }
            else throw new Error();
        } catch (e) {
            const backup = localStorage.getItem(LOCAL_BACKUP_KEY);
            if (backup) games = JSON.parse(backup);
            setSyncStatus('error', 'Sin conexion (local)');
        }
        document.getElementById('loadingOverlay').classList.add('hidden');
        renderHome();
        if (selectedGameId) renderGameDetail();
    }

    async function saveToCloud() {
        localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(games));
        if (!API_URL || API_URL === 'PEGA_TU_URL_AQUI' || isSaving) return;
        isSaving = true; setSyncStatus('syncing', 'Guardando...');
        try {
            const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ games }) });
            const d = await r.json();
            if (d.success) setSyncStatus('online', 'Sincronizado'); else throw new Error();
        } catch (e) { setSyncStatus('error', 'Error al guardar'); }
        isSaving = false;
    }

    // ============================================
    // HELPERS
    // ============================================
    function normalizePlayerName(n) { return n.toLowerCase().trim().replace(/\s+/g, ' '); }
    function scoreCls(s) { return s > 0 ? 'positive' : s < 0 ? 'negative' : 'zero'; }

    // ============================================
    // CREATE GAME
    // ============================================
    function createGame() {
        document.getElementById('formError').classList.remove('visible');
        const i1 = document.getElementById('player1Name'), i2 = document.getElementById('player2Name');
        i1.classList.remove('input-error'); i2.classList.remove('input-error');
        const n1 = i1.value.trim(), n2 = i2.value.trim();

        if (!n1 || !n2) {
            if (!n1) i1.classList.add('input-error'); if (!n2) i2.classList.add('input-error');
            document.getElementById('formError').textContent = 'Debes ingresar ambos nombres.';
            document.getElementById('formError').classList.add('visible'); return;
        }
        if (normalizePlayerName(n1) === normalizePlayerName(n2)) {
            i1.classList.add('input-error'); i2.classList.add('input-error');
            document.getElementById('formError').textContent = 'Los jugadores no pueden tener el mismo nombre.';
            document.getElementById('formError').classList.add('visible'); return;
        }

        games.unshift({
            id: Date.now(),
            createdAt: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }),
            players: [{ name: n1, score: 0 }, { name: n2, score: 0 }],
            pending: [], history: []
        });
        saveToCloud();
        i1.value = ''; i2.value = '';
        navigateTo('home');
    }

    // ============================================
    // GAME ACTIONS
    // ============================================
    function proposePoints(gId, pIdx, amt) {
        const g = games.find(x => x.id === gId); if (!g) return;
        g.pending.push({ id: Date.now(), playerIndex: pIdx, amount: amt, label: amt > 0 ? 'Asertivo' : 'No asertivo', time: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) });
        saveToCloud(); renderGameDetail();
    }

    function showApprovalConfirm(gId, pId) { approvalConfirmKey = gId + '-' + pId; renderGameDetail(); }
    function cancelApproval() { approvalConfirmKey = null; renderGameDetail(); }

    function confirmApproval(gId, pId) {
        const g = games.find(x => x.id === gId); if (!g) return;
        const idx = g.pending.findIndex(p => p.id === pId); if (idx === -1) return;
        const pend = g.pending[idx];
        g.players[pend.playerIndex].score += pend.amount;
        g.history.unshift({ player: g.players[pend.playerIndex].name, amount: pend.amount, label: pend.label, approvedBy: g.players[pend.playerIndex === 0 ? 1 : 0].name, time: pend.time });
        if (g.history.length > 30) g.history.pop();
        g.pending.splice(idx, 1); approvalConfirmKey = null;
        saveToCloud(); renderGameDetail();
    }

    function rejectPending(gId, pId) {
        const g = games.find(x => x.id === gId); if (!g) return;
        g.pending = g.pending.filter(p => p.id !== pId); approvalConfirmKey = null;
        saveToCloud(); renderGameDetail();
    }

    function showDeleteConfirm() { deleteConfirmId = selectedGameId; renderGameDetail(); }
    function cancelDelete() { deleteConfirmId = null; renderGameDetail(); }

    function confirmDelete() {
        games = games.filter(g => g.id !== selectedGameId);
        deleteConfirmId = null; selectedGameId = null;
        saveToCloud(); navigateTo('home');
    }

    // ============================================
    // RENDER: HOME
    // ============================================
    function renderHome() {
        const el = document.getElementById('homeContent');

        if (games.length === 0) {
            el.innerHTML = '<p class="no-games-msg">No hay juegos activos.</p>' +
                '<button class="btn-new-game" onclick="navigateTo(\'create\')">+ Crear primer juego</button>';
            return;
        }

        const cards = games.map(g => {
            const p1 = g.players[0], p2 = g.players[1];
            const pending = g.pending.length;
            const pb = pending > 0 ? '<span class="gcm-pending">' + pending + ' pend.</span>' : '';

            return '<div class="game-card-mini" onclick="navigateTo(\'game\',' + g.id + ')">' +
                '<div class="gcm-info"><h3>' + p1.name + ' vs ' + p2.name + pb + '</h3><div class="gcm-date">' + g.createdAt + '</div></div>' +
                '<div class="gcm-scores">' +
                    '<div class="gcm-player"><div class="gcm-name">' + p1.name + '</div><div class="gcm-score ' + scoreCls(p1.score) + '">' + p1.score + '</div></div>' +
                    '<span class="gcm-vs">vs</span>' +
                    '<div class="gcm-player"><div class="gcm-name">' + p2.name + '</div><div class="gcm-score ' + scoreCls(p2.score) + '">' + p2.score + '</div></div>' +
                    '<span class="gcm-arrow">&#8250;</span>' +
                '</div></div>';
        }).join('');

        el.innerHTML = '<div class="home-title">Juegos activos (' + games.length + ')</div>' +
            '<div class="game-list">' + cards + '</div>' +
            '<button class="btn-new-game" onclick="navigateTo(\'create\')">+ Crear nuevo juego</button>';
    }

    // ============================================
    // RENDER: GAME DETAIL
    // ============================================
    function renderGameDetail() {
        const el = document.getElementById('gameDetail');
        const game = games.find(g => g.id === selectedGameId);
        if (!game) { navigateTo('home'); return; }

        const p1 = game.players[0], p2 = game.players[1];

        // Players
        const playersHTML = [0, 1].map(i => {
            const p = game.players[i];
            return '<div class="player"><div class="player-name">' + p.name + '</div>' +
                '<div class="player-score ' + scoreCls(p.score) + '" id="score-' + game.id + '-' + i + '">' + p.score + '</div>' +
                '<div class="player-buttons"><p class="btn-label">Solo ' + p.name + ' usa estos:</p>' +
                '<button class="btn-point btn-assertive" onclick="proposePoints(' + game.id + ',' + i + ',50)">+50 Fui asertivo</button>' +
                '<button class="btn-point btn-not-assertive" onclick="proposePoints(' + game.id + ',' + i + ',-60)">-60 No fui asertivo</button></div></div>';
        }).join('');

        // Pending
        let pendingHTML = '';
        if (game.pending.length > 0) {
            const items = game.pending.map(pend => {
                const proposer = game.players[pend.playerIndex].name;
                const approver = game.players[pend.playerIndex === 0 ? 1 : 0].name;
                const key = game.id + '-' + pend.id;
                const showConf = approvalConfirmKey === key;

                const confHTML = showConf
                    ? '<div class="approval-confirm visible"><p>Solo <strong>' + approver + '</strong> puede aprobar. ¿Eres ' + approver + '?</p>' +
                      '<div class="confirm-btns"><button class="btn-approve" onclick="confirmApproval(' + game.id + ',' + pend.id + ')">Si, soy ' + approver + '</button>' +
                      '<button class="btn-reject" onclick="cancelApproval()">Cancelar</button></div></div>' : '';

                return '<div class="pending-item"><div class="pending-info">' +
                    '<span class="pending-who">' + proposer + '</span> reclama ' +
                    '<span class="pending-pts ' + (pend.amount > 0 ? 'pos' : 'neg') + '">' + (pend.amount > 0 ? '+' : '') + pend.amount + '</span> (' + pend.label + ')' +
                    '<div class="pending-approver">Solo ' + approver + ' puede aprobar</div></div>' +
                    '<div class="pending-actions"><button class="btn-approve-init" onclick="showApprovalConfirm(' + game.id + ',' + pend.id + ')">Aprobar</button>' +
                    '<button class="btn-reject" onclick="rejectPending(' + game.id + ',' + pend.id + ')">Rechazar</button></div></div>' + confHTML;
            }).join('');
            pendingHTML = '<div class="pending-section"><div class="pending-title pulse">Pendientes (' + game.pending.length + ')</div>' + items + '</div>';
        }

        // History
        const histItems = game.history.length > 0
            ? game.history.map(h => '<li class="history-item"><span class="h-name">' + h.player + '</span>' +
                '<span class="h-pts ' + (h.amount > 0 ? 'pos' : 'neg') + '">' + (h.amount > 0 ? '+' : '') + h.amount + '</span>' +
                '<span class="h-approved">Aprobado por ' + h.approvedBy + '</span><span class="h-time">' + h.time + '</span></li>').join('')
            : '<li style="color:#6b6b8a;text-align:center;padding:0.5rem;font-size:0.8rem;">Sin movimientos</li>';

        // Delete
        const showDel = deleteConfirmId === game.id;
        const delHTML = showDel
            ? '<div class="delete-confirm-inline visible"><p>¿Seguro que quieres eliminar este juego?</p>' +
              '<div class="dci-btns"><button class="btn-del-yes" onclick="confirmDelete()">Si, eliminar</button>' +
              '<button class="btn-del-no" onclick="cancelDelete()">Cancelar</button></div></div>'
            : '';

        el.innerHTML = '<div class="game-detail">' +
            '<div class="gd-header"><h2>' + p1.name + ' vs ' + p2.name + '</h2><div class="gd-date">' + game.createdAt + '</div></div>' +
            '<div class="players">' + playersHTML + '</div>' +
            pendingHTML +
            '<details class="game-history"><summary>Historial (' + game.history.length + ')</summary><ul class="history-list">' + histItems + '</ul></details>' +
            '<div class="gd-footer"><button class="btn-delete-game-detail" onclick="showDeleteConfirm()">Eliminar juego</button>' + delHTML + '</div></div>';
    }

    // ============================================
    // RENDER: SCOREBOARD
    // ============================================
    function renderScoreboard() {
        const sb = document.getElementById('scoreboard');
        if (games.length === 0) { sb.innerHTML = '<p class="section-empty">No hay juegos aun.</p>'; return; }

        let tP1 = 0, tP2 = 0, tM = 0;
        const rows = games.map(g => {
            const p1 = g.players[0], p2 = g.players[1], m = g.history.length, pn = g.pending.length;
            tP1 += p1.score; tP2 += p2.score; tM += m;
            let s1 = '', s2 = '';
            if (p1.score > p2.score) { s1 = '<span class="sb-leader winning">Lider</span>'; s2 = '<span class="sb-leader losing">Detras</span>'; }
            else if (p2.score > p1.score) { s2 = '<span class="sb-leader winning">Lider</span>'; s1 = '<span class="sb-leader losing">Detras</span>'; }
            else { s1 = '<span class="sb-leader tied">Empate</span>'; s2 = '<span class="sb-leader tied">Empate</span>'; }
            const pb = pn > 0 ? ' <span class="sb-pending-badge">' + pn + ' pend.</span>' : '';
            return '<tr><td><div class="sb-game-name">' + p1.name + ' vs ' + p2.name + '</div><div class="sb-date">' + g.createdAt + pb + '</div></td>' +
                '<td><div class="sb-player-cell"><span class="sb-player-name">' + p1.name + '</span><span class="sb-score ' + scoreCls(p1.score) + '">' + p1.score + '</span>' + s1 + '</div></td>' +
                '<td><div class="sb-player-cell"><span class="sb-player-name">' + p2.name + '</span><span class="sb-score ' + scoreCls(p2.score) + '">' + p2.score + '</span>' + s2 + '</div></td>' +
                '<td style="color:#a0a0c0">' + m + '</td></tr>';
        }).join('');
        sb.innerHTML = '<table class="data-table"><thead><tr><th>Juego</th><th>Jugador 1</th><th>Jugador 2</th><th>Jugadas</th></tr></thead>' +
            '<tbody>' + rows + '</tbody><tfoot><tr><td>Total (' + games.length + ')</td>' +
            '<td><span class="sb-score ' + scoreCls(tP1) + '">' + tP1 + '</span></td>' +
            '<td><span class="sb-score ' + scoreCls(tP2) + '">' + tP2 + '</span></td><td>' + tM + '</td></tr></tfoot></table>';
    }

    // ============================================
    // RENDER: DASHBOARD
    // ============================================
    function renderDashboard() {
        const dash = document.getElementById('dashboard');
        if (games.length === 0) { dash.innerHTML = '<p class="section-empty">No hay juegos aun.</p>'; return; }

        const pm = {};
        games.forEach(g => g.players.forEach(p => {
            const k = normalizePlayerName(p.name);
            if (!pm[k]) pm[k] = { displayName: p.name, totalScore: 0, gameCount: 0, gameNames: [] };
            pm[k].totalScore += p.score; pm[k].gameCount++;
            const opp = g.players.find(o => normalizePlayerName(o.name) !== k);
            pm[k].gameNames.push(opp ? 'vs ' + opp.name : g.createdAt);
        }));

        const players = Object.values(pm).sort((a, b) => b.totalScore - a.totalScore);
        const maxAbs = Math.max(1, ...players.map(p => Math.abs(p.totalScore)));

        const rows = players.map((p, i) => {
            const avg = (p.totalScore / p.gameCount).toFixed(1);
            const barW = p.totalScore === 0 ? 0 : Math.round((Math.abs(p.totalScore) / maxAbs) * 100);
            let rc = 'normal'; if (i === 0) rc = 'gold'; else if (i === 1) rc = 'silver'; else if (i === 2) rc = 'bronze';
            return '<tr><td><span class="dash-rank ' + rc + '">' + (i + 1) + '</span><span class="dash-name">' + p.displayName + '</span></td>' +
                '<td><span class="dash-games-badge">' + p.gameCount + ' juego' + (p.gameCount !== 1 ? 's' : '') + '</span><div class="dash-game-list">' + p.gameNames.join(', ') + '</div></td>' +
                '<td><span class="sb-score ' + scoreCls(p.totalScore) + '">' + p.totalScore + '</span><div class="dash-bar-container"><div class="dash-bar ' + scoreCls(p.totalScore) + '" style="width:' + barW + '%"></div></div></td>' +
                '<td><span class="dash-avg">' + avg + '</span></td></tr>';
        }).join('');

        dash.innerHTML = '<table class="data-table"><thead><tr><th>Jugador</th><th>Juegos</th><th>Puntaje Total</th><th>Promedio</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    // ============================================
    // AUTO-REFRESH
    // ============================================
    setInterval(() => { if (API_URL && API_URL !== 'PEGA_TU_URL_AQUI' && !isSaving) loadFromCloud(); }, 15000);

    // ============================================
    // INIT
    // ============================================
    loadFromCloud();
</script>

</body>
</html>
